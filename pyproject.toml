[project]
name = "medsignal"
version = "0.1.0"
description = "Drug-safety signals from patient reviews: LLM-distilled adverse-event and discontinuation extraction, compared with FDA FAERS and drug labels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Brindeshwar Sharma", email = "brinde.sharma@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["pharmacovigilance", "adverse drug events", "nlp", "llm", "distillation", "faers"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core deps are added per phase with `uv add` so versions are resolved, not guessed.
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
]

[project.optional-dependencies]
# GPU training stack (local only; CI runs CPU tests without it). CUDA 13.0 wheels match the
# owner's driver (CUDA 13.4). Install with: uv sync --extra gpu
gpu = [
    "torch>=2.14.1",
    "transformers>=4.57",
    "accelerate>=1.10",
]

[project.urls]
Repository = "https://github.com/brindeshwar/medsignal"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "NPY", "PD"]
ignore = ["E501"]  # formatter handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N"]
"notebooks/**" = ["E402", "T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
packages = ["medsignal"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires a CUDA GPU",
    "network: requires internet access",
]

[tool.coverage.run]
source = ["medsignal"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# Keep uv's package cache inside the project (owner preference: everything in this folder;
# also avoids slow cross-drive copies when the project is not on C:).
cache-dir = ".cache/uv"
# Lock only for the platforms we use (CUDA wheels do not exist for macOS).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
