name: Bug report
description: Something is broken or produces wrong output
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the error/wrong output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / config
      placeholder: "git SHA and configs/… used"
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "OS, GPU, `uv --version`, Python version"
