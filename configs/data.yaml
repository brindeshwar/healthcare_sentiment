# Phase 1 data pipeline config. Paths are relative to the project root.
seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed

# Sources fetched by `python -m medsignal.data.download`.
# kind: url    -> downloaded automatically; sha256 verified when set
# kind: manual -> must be placed by hand (login required / no longer public); presence is checked
# Licence notes and provenance: docs/DATA.md
sources:
  drugrev:
    kind: url
    url: https://data.mendeley.com/public-files/datasets/64cc5w5dxy/files/288e24c1-4605-4c4b-9a88-c789f94dbe35/file_downloaded
    filename: DrugReviews.csv
    sha256: 2fa6fa5227076d32841857968d9df6eec675698a1acef1803ba8c33c0ccbc41c
  druglib:
    kind: url
    url: https://archive.ics.uci.edu/static/public/461/drug+review+dataset+druglib+com.zip
    filename: druglib.zip
    sha256: 3500936fb8473414b731c89d8c4395ab2dd65e2a99e9d79ee998328408a7ddcc
    extract: true
  drugscom_uci:
    kind: manual
    files: [drugsComTrain_raw.csv]
    note: "UCI #462 was withdrawn (403 / 'not found', checked 2026-10-13). Use a copy obtained while it was public; not redistributed."
  cadec:
    # External expert gold for ADE spans + MedDRA normalisation (ADR-0018).
    # CSIRO Data Licence: non-commercial, attribution, no redistribution.
    kind: url
    url: https://data.csiro.au/dap/ws/v2/collections/17190/data/48639771
    filename: CADEC.v2.zip
    sha256: 4045b926a0a5735f00f785f7ad935e5a73731d6ab607d11d88880a334be18c4a
    extract: true
  psytar:
    # External expert gold for ADEs, withdrawal, effectiveness (ADR-0018). CC BY 4.0.
    kind: manual
    files: [PsyTAR_dataset.xlsx]
    note: "AskaPatient is bot-protected (no scripted download): open https://www.askapatient.com/research/pharmacovigilance/corpus-ades-psychiatric-medications.asp in a browser and save the xlsx here"
  webmd:
    kind: manual
    files: [webmd.csv]
    note: "Kaggle login required: https://www.kaggle.com/datasets/rohanharode07/webmd-drug-reviews-dataset"

cleaning:
  min_review_chars: 20
  decode_html: true

splits:
  # After de-duplication. drug_holdout first (whole brand/generic drug groups), then the rest
  # is stratified by (sentiment bucket, source) into train/val/test. See ADR-0013.
  val_fraction: 0.1
  test_fraction: 0.1
  drug_holdout_fraction: 0.1
  max_holdout_group_share: 0.01   # groups above 1% of reviews (e.g. top contraceptives) are never held out

eda:
  tokenizer: thomas-sounack/BioClinical-ModernBERT-base   # student encoder (ADR-0006); MIT licence
  max_length: 256
