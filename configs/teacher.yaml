# Phase 2: LLM teacher benchmark (ADR-0018). Model/prompt selection on dev only; test scored once.
seed: 7
external_config: configs/external.yaml

corpus: cadec
split: dev

candidates:
  - qwen3.5:9b-q4_K_M
  - gemma4:e4b-it-q4_K_M
  - qwen3.5:4b-q4_K_M

llm:
  temperature: 0.0
  num_ctx: 4096
  max_retries: 2
  prompt: v1                       # v1 | v2 (ADR-0019); override with --prompt
  drop_unaligned_on_failure: false # true = drop only non-verbatim spans instead of failing the doc

predictions_dir: data/processed/teacher   # git-ignored (contains spans of licensed text)
report_dir: reports/teacher
